<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kurr Kurr - 404</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #3a2a0a, #151515 45%, #080808);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.box {
    max-width: 400px;
    width: 100%;
    padding: 40px 25px;
    background: rgba(255,255,255,0.04);
    border: 1px solid #4b3b16;
    border-radius: 25px;
    animation: show 0.5s ease;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.icon {
    font-size: 70px;
}

.small-title {
    color: #c9a227;
    letter-spacing: 4px;
    font-size: 12px;
    margin-top: 15px;
}

h1 {
    font-size: 55px;
    margin: 10px 0;
    color: #c9a227;
}

p {
    color: #999;
    line-height: 1.6;
}

.buttons {
    margin-top: 25px;
}

a {
    display: inline-block;
    padding: 13px 25px;
    background: #c9a227;
    color: #111;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
}

a:active {
    transform: scale(0.94);
}
</style>
</head>

<body>

<div class="box">

    <div class="icon">🐦</div>

    <div class="small-title">
        KURR KURR
    </div>

    <h1>404</h1>

    <p>
        Oops! Page ini tidak dijumpai.
        <br>
        Mungkin burung Kurr Kurr sudah terbang.
    </p>

    <div class="buttons">
        <a href="index.html">🏠 Back Home</a>
    </div>

</div>

</body>
</html>
