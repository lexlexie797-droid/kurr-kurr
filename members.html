<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kurr Kurr - Members</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #3a2a0a, #151515 45%, #080808);
    color: white;
}

header {
    text-align: center;
    padding: 30px 20px 15px;
}

.small-title {
    color: #c9a227;
    font-size: 12px;
    letter-spacing: 4px;
}

h1 {
    margin: 10px 0;
    font-size: 34px;
    letter-spacing: 5px;
}

header p {
    color: #999;
    font-size: 14px;
}

nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 18px 0;
}

nav a {
    color: #c9a227;
    text-decoration: none;
    padding: 9px 12px;
    border: 1px solid #4b3b16;
    border-radius: 20px;
    font-size: 13px;
}

.search {
    display: block;
    width: calc(100% - 40px);
    max-width: 600px;
    margin: 10px auto;
    padding: 13px 16px;
    border-radius: 25px;
    border: 1px solid #4b3b16;
    background: #151515;
    color: white;
    outline: none;
}

.search:focus {
    border-color: #c9a227;
}

.add-button {
    display: block;
    width: calc(100% - 40px);
    max-width: 300px;
    margin: 15px auto;
    padding: 13px;
    border: none;
    border-radius: 25px;
    background: #c9a227;
    color: #111;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.count {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin: 15px 0;
}

.count span {
    color: #c9a227;
}

.members {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.member {
    position: relative;
    background: rgba(255,255,255,0.04);
    border: 1px solid #4b3b16;
    border-radius: 18px;
    padding: 22px 10px;
    text-align: center;
    text-decoration: none;
    color: white;
    transition: transform 0.2s, border-color 0.2s;
}

.member:active {
    transform: scale(0.94);
    border-color: #c9a227;
}

.emoji {
    font-size: 40px;
}

.name {
    margin-top: 10px;
    color: #c9a227;
    font-weight: bold;
}

.status {
    margin-top: 7px;
    font-size: 11px;
}

.dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 4px;
}

.green {
    background: #4caf50;
    box-shadow: 0 0 6px #4caf50;
}

.red {
    background: #777;
}

.delete {
    position: absolute;
    top: 7px;
    right: 7px;
    border: none;
    background: #441111;
    color: #ff7777;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    cursor: pointer;
}

.hidden {
    display: none;
}

.back {
    display: block;
    width: fit-content;
    margin: 10px auto 30px;
    padding: 12px 25px;
    background: #c9a227;
    color: #111;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
}

/* POPUP */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.modal-box {
    width: 100%;
    max-width: 380px;
    background: #151515;
    border: 1px solid #c9a227;
    border-radius: 20px;
    padding: 25px;
}

.modal-box h2 {
    text-align: center;
    color: #c9a227;
    margin-top: 0;
}

.modal-box input,
.modal-box select {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #4b3b16;
    background: #080808;
    color: white;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.modal-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
}

.save {
    background: #c9a227;
    color: #111;
}

.cancel {
    background: #333;
    color: white;
}
</style>
</head>

<body>

<header>

    <div class="small-title">THE GROUP</div>

    <h1>KURR KURR</h1>

    <p><span id="totalCount">8</span> Members • One Group</p>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="members.html">👥 Members</a>
        <a href="gallery.html">📸 Gallery</a>
    </nav>

</header>

<input
    class="search"
    id="search"
    type="search"
    placeholder="🔍 Search member..."
>

<button class="add-button" onclick="openModal()">
    ＋ Add Member
</button>

<div class="count">
    <span id="onlineCount">5</span> Online •
    <span id="offlineCount">3</span> Offline
</div>

<div class="members" id="members">

    <a class="member" data-name="ren" href="profile.html?name=ren">
        <div class="emoji">🐒</div>
        <div class="name">Ren</div>
        <div class="status">
            <span class="dot green"></span>Online
        </div>
    </a>

    <a class="member" data-name="adriel" href="profile.html?name=adriel">
        <div class="emoji">🦍</div>
        <div class="name">Adriel</div>
        <div class="status">
            <span class="dot green"></span>Online
        </div>
    </a>

    <a class="member" data-name="slayvester" href="profile.html?name=slayvester">
        <div class="emoji">🐈</div>
        <div class="name">Slayvester</div>
        <div class="status">
            <span class="dot red"></span>Offline
        </div>
    </a>

    <a class="member" data-name="bryan" href="profile.html?name=bryan">
        <div class="emoji">🐶</div>
        <div class="name">Bryan</div>
        <div class="status">
            <span class="dot green"></span>Online
        </div>
    </a>

    <a class="member" data-name="nano" href="profile.html?name=nano">
        <div class="emoji">🐻</div>
        <div class="name">Nano</div>
        <div class="status">
            <span class="dot red"></span>Offline
        </div>
    </a>

    <a class="member" data-name="jeremy" href="profile.html?name=jeremy">
        <div class="emoji">🦉</div>
        <div class="name">Jeremy</div>
        <div class="status">
            <span class="dot green"></span>Online
        </div>
    </a>

    <a class="member" data-name="facrindan" href="profile.html?name=facrindan">
        <div class="emoji">🫏</div>
        <div class="name">facrindan</div>
        <div class="status">
            <span class="dot green"></span>Online
        </div>
    </a>

    <a class="member" data-name="noel" href="profile.html?name=noel">
        <div class="emoji">🐛</div>
        <div class="name">Noel</div>
        <div class="status">
            <span class="dot red"></span>Offline
        </div>
    </a>

</div>

<a class="back" href="index.html">🏠 Back Home</a>


<!-- ADD MEMBER POPUP -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2>＋ Add Member</h2>

        <input
            type="text"
            id="memberName"
            placeholder="Nama member"
        >

        <input
            type="text"
            id="memberEmoji"
            placeholder="Emoji contoh: 🐱"
            maxlength="2"
        >

        <select id="memberStatus">
            <option value="online">🟢 Online</option>
            <option value="offline">⚫ Offline</option>
        </select>

        <div class="modal-buttons">

            <button class="cancel" onclick="closeModal()">
                Cancel
            </button>

            <button class="save" onclick="addMember()">
                Add Member
            </button>

        </div>

    </div>

</div>


<script>

const search = document.getElementById("search");
const membersContainer = document.getElementById("members");

let savedMembers =
    JSON.parse(localStorage.getItem("kurrKurrMembers")) || [];


// OPEN POPUP

function openModal() {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("memberName").focus();
}


// CLOSE POPUP

function closeModal() {
    document.getElementById("modal").style.display = "none";

    document.getElementById("memberName").value = "";
    document.getElementById("memberEmoji").value = "";
    document.getElementById("memberStatus").value = "online";
}


// ADD MEMBER

function addMember() {

    const name =
        document.getElementById("memberName").value.trim();

    const emoji =
        document.getElementById("memberEmoji").value.trim() || "👤";

    const status =
        document.getElementById("memberStatus").value;

    if (!name) {
        alert("Sila masukkan nama member.");
        return;
    }

    const newMember = {
        name: name,
        emoji: emoji,
        status: status
    };

    savedMembers.push(newMember);

    localStorage.setItem(
        "kurrKurrMembers",
        JSON.stringify(savedMembers)
    );

    createMember(newMember);

    closeModal();

    updateCount();
}


// CREATE MEMBER

function createMember(member) {

    const card = document.createElement("div");

    card.className = "member";
    card.dataset.name = member.name.toLowerCase();

    const statusClass =
        member.status === "online" ? "green" : "red";

    const statusText =
        member.status === "online" ? "Online" : "Offline";

    card.innerHTML = `
        <button class="delete"
            onclick="deleteMember(this, '${escapeName(member.name)}')">
            ×
        </button>

        <a href="profile.html?name=${encodeURIComponent(member.name)}"
           style="text-decoration:none;color:white;display:block;">

            <div class="emoji">${member.emoji}</div>

            <div class="name">${member.name}</div>

            <div class="status">
                <span class="dot ${statusClass}"></span>
                ${statusText}
            </div>

        </a>
    `;

    membersContainer.appendChild(card);
}


// DELETE MEMBER

function deleteMember(button, name) {

    if (!confirm("Padam member " + name + "?")) {
        return;
    }

    savedMembers =
        savedMembers.filter(member => member.name !== name);

    localStorage.setItem(
        "kurrKurrMembers",
        JSON.stringify(savedMembers)
    );

    button.parentElement.remove();

    updateCount();
}


// SEARCH

search.addEventListener("input", function() {

    const text =
        search.value.toLowerCase().trim();

    document.querySelectorAll(".member").forEach(function(member) {

        const name =
            member.dataset.name.toLowerCase();

        if (name.includes(text)) {
            member.classList.remove("hidden");
        } else {
            member.classList.add("hidden");
        }

    });

});


// LOAD SAVED MEMBERS

savedMembers.forEach(function(member) {
    createMember(member);
});


// UPDATE COUNTS

function updateCount() {

    const allMembers =
        document.querySelectorAll(".member");

    let online = 0;
    let offline = 0;

    allMembers.forEach(function(member) {

        const dot =
            member.querySelector(".dot");

        if (dot.classList.contains("green")) {
            online++;
        } else {
            offline++;
        }

    });

    document.getElementById("onlineCount").textContent = online;
    document.getElementById("offlineCount").textContent = offline;
    document.getElementById("totalCount").textContent =
        online + offline;
}


// ESCAPE NAME

function escapeName(name) {
    return name.replace(/'/g, "\\'");
}

updateCount();

</script>

</body>
</html>
